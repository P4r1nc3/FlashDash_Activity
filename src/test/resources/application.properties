### SPRING ###
server.port=7070
spring.application.name = FlashDash_Activity
spring.datasource.url = jdbc:h2:mem:testdb
spring.datasource.username = ${DB_ACTIVITY_USERNAME}
spring.datasource.password = ${DB_ACTIVITY_PASSWORD}
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true

### SECRETS ###
jwt.secret = ${JWT_KEY}

### LOGS ###
logging.pattern.console = %d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n